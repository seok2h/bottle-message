# 로컬 개발용 PostgreSQL 컨테이너
#
# 사용법:
#   1) docker compose up -d        # DB 컨테이너 기동
#   2) db/init-db.ps1  (또는 sh)   # 스키마 + 시드 적용 (최초 1회)
#   docker compose down            # 중지
#   docker compose down -v         # 데이터 볼륨까지 삭제 (초기화)
#
# 참고: 스키마/시드는 docker-entrypoint-initdb.d 자동 마운트 대신
#       init-db 스크립트(docker cp)로 적용한다.
#       (프로젝트가 Google Drive 등 가상 드라이브에 있으면 바인드 마운트가
#        컨테이너에 비어 보이는 문제가 있어, 어디서든 동작하는 방식으로 통일)

services:
  db:
    image: postgres:18
    container_name: bottle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bottle
      POSTGRES_PASSWORD: bottle_dev_pw
      POSTGRES_DB: bottle
      # PG18 이미지는 /var/lib/postgresql/18/docker 에 클러스터를 미리 포함하므로
      # 이미지가 건드리지 않는 별도 경로를 PGDATA로 지정한다.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - bottle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottle -d bottle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bottle_pgdata:
