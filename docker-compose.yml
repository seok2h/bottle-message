# 로컬 개발용 PostgreSQL 컨테이너
#
# 사용법:
#   docker compose up -d        # 기동 (첫 기동 시 db/*.sql 자동 적용)
#   docker compose down         # 중지
#   docker compose down -v      # 데이터 볼륨까지 삭제 (다시 up 하면 재초기화)
#
# 첫 기동 시 ./db 의 *.sql 이 파일명 순서대로 자동 실행된다.
#   01_schema.sql -> 02_seed.sql
# (시드만 다시 적용하고 싶을 때는 db/init-db.ps1 / .sh 사용)

services:
  db:
    image: postgres:18
    container_name: bottle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bottle
      POSTGRES_PASSWORD: bottle_dev_pw
      POSTGRES_DB: bottle
      # PG18 이미지는 /var/lib/postgresql/18/docker 에 클러스터를 미리 포함하므로
      # 이미지가 건드리지 않는 별도 경로를 PGDATA로 지정한다.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - bottle_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d   # 첫 기동 시 스키마/시드 자동 적용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottle -d bottle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bottle_pgdata:
